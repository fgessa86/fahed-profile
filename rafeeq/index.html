<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rafeeq: A Neighbourhood Health Network</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="frame"></iframe>
<script>
(function(){
  var mq = window.matchMedia('(max-width:768px)');
  var frame = document.getElementById('frame');
  function route(e){
    var src = e.matches ? '/rafeeq/mobile.html' : '/rafeeq/desktop.html';
    if(frame.src.indexOf(src) === -1) frame.src = src;
  }
  route(mq);
  mq.addEventListener('change', route);

  // Let desktop.html scroll naturally
  frame.addEventListener('load', function(){
    if(!mq.matches){
      frame.style.overflow = 'auto';
    }
  });
})();
</script>
</body>
</html>
